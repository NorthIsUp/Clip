name: TestFlight

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: testflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ship:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      ASC_KEY_ID: 238ATU74S4
      ASC_ISSUER_ID: 98c62465-9650-49ec-afe4-23318e5c1ae1
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - name: Signing
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          DEV_P12: ${{ secrets.DEV_P12 }}
          DIST_P12: ${{ secrets.DIST_P12 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: scripts/ci-signing.sh
      - name: Archive and upload
        run: scripts/testflight.sh ${{ github.event_name == 'pull_request' && '--no-upload' || '' }}
